<footer>
  <div class="footer-icons">
    <a href="https://www.facebook.com/dave.mcclure.140" target="_blank" rel="noopener">
      <img src="{{ "/assets/facebook-icon.svg" | relative_url }}" alt="Facebook" class="footer-icon">
    </a>
    <a href="mailto:daveintheshack@gmail.com">
      <img src="{{ "/assets/inbox-icon.svg" | relative_url }}" alt="Email" class="footer-icon">
    </a>
  </div>
  <span>
    &copy; <time datetime="{{ site.time }}">{{ site.time | date: '%Y' }}</time> {{ site.author.name }}
  </span>
  <button id="back-to-top" title="Back to top">&#8593;</button>
</footer>

<script>
  var backToTopButton = document.getElementById('back-to-top');
  window.addEventListener('scroll', function() {
    if (window.pageYOffset > 300) {
      backToTopButton.style.display = 'flex';
    } else {
      backToTopButton.style.display = 'none';
    }
  });
  backToTopButton.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
