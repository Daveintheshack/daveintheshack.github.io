<nav class="nav">
  <div class="nav-container">
    <a href="{{ site.baseurl }}/">
      <h2 class="nav-title">{{ site.title }}</h2>
    </a>
    <ul>
      <li><a href="{{ '/blog' | prepend: site.baseurl }}">Posts</a></li>
      <li><a href="{{ '/tags' | prepend: site.baseurl }}">Tags</a></li>
      <li><a href="{{ site.baseurl }}/">About</a></li>
      <li>
        <input type="text" id="search-input" placeholder="Search...">
        <ul id="results-container"></ul>
      </li>
    </ul>
  </div>
</nav>
<script src="{{ site.baseurl }}/assets/js/simple-jekyll-search.min.js"></script>
<script>
  SimpleJekyllSearch({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('results-container'),
    json: '{{ site.baseurl }}/search.json'
  });
</script>

<button id="dark-mode-toggle" aria-label="Toggle dark mode">🌙</button>
<script>
  var toggle = document.getElementById('dark-mode-toggle');
  var html = document.documentElement;
  if (localStorage.getItem('dark-mode') === 'true') {
    html.classList.add('dark-mode');
  }
  toggle.addEventListener('click', function() {
    html.classList.toggle('dark-mode');
    localStorage.setItem('dark-mode', html.classList.contains('dark-mode'));
  });
</script>
